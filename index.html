const n360=x=>((x%360)+360)%360,rd=x=>x*Math.PI/180,dg=x=>x*180/Math.PI;
function tzOff(tz,ms){const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(new Date(ms)).reduce((a,x)=>(a[x.type]=+x.value,a),{});return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-Math.floor(ms/1000)*1000}
function toUTC(y,m,d,h,mi,tz){const g=Date.UTC(y,m-1,d,h,mi);let u=g-tzOff(tz,g);u=g-tzOff(tz,u);return u}
function eclLon(b,t){const v=Astronomy.GeoVector(b,t,true);return Astronomy.SphereFromVector(Astronomy.RotateVector(Astronomy.Rotation_EQJ_ECT(t),v)).lon}
function lonFromRA(ra,e){return n360(dg(Math.atan2(Math.sin(rd(ra)),Math.cos(rd(ra))*Math.cos(rd(e)))))}
function plac(ramc,e,lat){const cu=(k,up)=>{let ra=up?ramc+k*90:ramc+180-k*90;for(let i=0;i<20;i++){const L=lonFromRA(ra,e),dec=Math.asin(Math.sin(rd(e))*Math.sin(rd(L))),x=-Math.tan(rd(lat))*Math.tan(dec);if(Math.abs(x)>=1)return null;const SA=dg(Math.acos(x));ra=up?ramc+k*SA:ramc+180-k*(180-SA)}return lonFromRA(ra,e)};

function calc(f){const t=Astronomy.MakeTime(new Date(f.utc)),T=t.tt/36525,out={notes:[]};
out.pl=PL.map(([nm,g],i)=>{const b=Astronomy.Body[nm],L=eclLon(b,t);let r=false;if(i>1){let d=eclLon(b,t.AddDays(.5))-eclLon(b,t.AddDays(-.5));d=((d+540)%360)-180;r=d<0}return{nm,g,L:n360(L),r}});

out.asc=null;if(f.known){const lat=f.lat,e=Astronomy.e_tilt(t).tobl,ramc=n360(Astronomy.SiderealTime(t)*15+f.lon),mc=lonFromRA(ramc,e),asc=n360(dg(Math.atan2(Math.cos(rd(ramc)),-(Math.sin(rd(ramc))*Math.cos(rd(e))+Math.tan(rd(lat))*Math.sin(rd(e))))));
let pc=Math.abs(lat)<66?plac(ramc,e,lat):null,cu;
if(pc){cu=[asc,pc.c2,pc.c3,n360(mc+180),n360(pc.c11+180),n360(pc.c12+180),n360(asc+180),n360(pc.c2+180),n360(pc.c3+180),mc,pc.c11,pc.c12];out.hs='Placidus'}
else{const s=Math.floor(asc/30)*30;cu=[...Array(12)].map((_,i)=>n360(s+i*30));out.hs='Whole Sign';out.notes.push('Placidus cannot be computed reliably at this latitude, so Whole Sign houses were used instead.')}

const hseOf=(L,cu)=>{for(let i=0;i<12;i++){const a=cu[i],b=cu[(i+1)%12];if(n360(L-a)<n360(b-a))return i+1}return 1};

function wheel(c){const S=360,C=S/2,R=170,asc=c.asc||0,ang=L=>rd(180+L-asc),pt=(L,r)=>[C+r*Math.cos(ang(L)),C-r*Math.sin(ang(L))];let s=`<svg viewBox="0 0 ${S} ${S}" style="width:100%;max-width:460px;display:block;margin:auto" role="img" aria-label="Natal chart wheel"><circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="var(--gold)"/><circle cx="${C}" cy="${C}" r="${R-26}" fill="none" stroke="var(--bd)"/><circle cx="${C}" cy="${C}" r="70" fill="none" stroke="var(--bd)"/>`;

S[0]=`<h2>Overview</h2><div class="card"><b>${f.city}, ${f.country}</b><br>${f.d}/${f.m}/${f.y} · ${f.known?f.tstr:'Birth time unknown'}<br><span class="mut">UTC ${new Date(f.utc).toISOString().replace('T',' ').slice(0,16)} · ${f.tz} · ${f.lat.toFixed(2)}, ${f.lon.toFixed(2)} · Tropical zodiac · ${c.hs||'No houses'}</span></div>${known?'':'<div class="card">Birth time is unknown: Ascendant, MC and houses are <b>unavailable</b>. Planets were computed for 12:00 local time; the Moon moves ~6° either way, so its sign or degree may be unreliable.</div>'}${c.notes.map(n=>`<div class="card">${n}</div>`).join('')}<div class="card"><b>How this is calculated</b><p class="mut">Geocentric planetary longitudes come from the Astronomy Engine ephemeris, referenced to the true ecliptic of date (tropical). Your local birth time is converted to UTC using the IANA time zone database, including historical offsets and daylight saving. Houses use Placidus from local sidereal time and latitude. Nodes use the mean-node formula. Chiron is not supported and is not shown. Part of Fortune and angles are symbolic points derived from calculated positions.</p></div>`;

S[4]=`<h2>The Twelve Houses</h2>${known?'':'<div class="card">Houses are unavailable without a birth time.</div>'}${HD.map((h,i)=>{const ps=known?P.filter(p=>p.h==i+1).map(p=>p.g+' '+p.nm):[];return`<div class="card"><b>House ${i+1}</b> — ${h}${known?`<br><span class="mut">Cusp ${fmt(c.cu[i])} · ${ps.length?ps.join(', '):'No planets'}</span>`:''}</div>`}).join('')}${chr('hs')}`;
S[5]=`<h2>Aspects</h2><p class="mut">Orbs used: ${ASP.map(a=>a[0]+' '+a[2]+'°').join(', ')}. Planet-to-planet only.</p>${tbl(['Planets','Aspect','Separation','Orb'],c.asp.map(a=>[a.a.g+' '+a.a.nm+' – '+a.b.g+' '+a.b.nm,a.nm,a.s.toFixed(2)+'°',a.orb.toFixed(2)+'°']))}<p class="mut">Traditionally, conjunctions blend energies, trines and sextiles are read as easier flow, and squares and oppositions as tension that invites growth.</p>${chr('as')}`;
S[6]=`<h2>Elements & Modalities</h2><div class="grid"><div class="card"><h3>Elements</h3>${bars(c.el,EL)}<p class="mut">Fire: energy; Earth: practicality; Air: ideas; Water: feeling.</p></div><div class="card"><h3>Modalities</h3>${bars(c.mo,MO)}<p class="mut">Cardinal: initiating; Fixed: sustaining; Mutable: adapting.</p></div></div><p>Traditionally, your strongest element is <b>${EL[c.el.indexOf(Math.max(...c.el))]}</b> and strongest modality <b>${MO[c.mo.indexOf(Math.max(...c.mo))]}</b>.</p>${chr('em')}`;
S[7]=`<h2>Life Themes</h2>${P.slice(0,7).map(p=>`<div class="card"><b>${p.nm}</b> in ${SG[sgn(p.L)]}: traditionally linked to ${PL.find(x=>x[0]==p.nm)[2]}, with a ${SD[sgn(p.L)][0]} flavor.</div>`).join('')}`;
S[8]=`<h2>Strengths & Growth Areas</h2>${tbl(['Placement','May be a strength','May need growth'],P.slice(0,7).map(p=>[p.g+' '+p.nm+' in '+SG[sgn(p.L)],SD[sgn(p.L)][1],SD[sgn(p.L)][2]]))}`;
S[9]=`<h2>Beyond the Stars: A Christ-Centered Reflection</h2><div class="card"><p><b>Reflect.</b> What does this report invite me to examine about my behavior and character?</p><p><b>Grow.</b> What areas of my life need greater patience, discipline, humility, love or self-control?</p><p><b>Anchor.</b> How can I bring my thoughts, decisions and actions into alignment with the teachings of Christ?</p></div>${SC.map(s=>`<div class="card"><b class="gold">${s[0]}</b><p>${s[1]}</p><p class="mut"><i>${s[2]}</i></p></div>`).join('')}<p class="mut">Placements do not reveal God’s will, gifts, calling or plans for you.</p>`;
S[10]=`<h2>Summary</h2><div class="card"><pre style="white-space:pre-wrap;font:inherit" id="sum">${summary(c)}</pre></div><div class="noprint"><button class="btn" onclick="navigator.clipboard.writeText($('#sum').textContent)">Copy summary</button> <button class="btn o" onclick="print()">Print / Save as PDF</button></div>${DISC}`;return S}
function summary(c){const P=c.pl;return `Selah chart — ${c.f.city}, ${c.f.d}/${c.f.m}/${c.f.y}\nSun: ${fmt(P[0].L)}\nMoon: ${fmt(P[1].L)}\nRising: ${c.cu?fmt(c.asc):'Unavailable (birth time unknown)'}\n`+P.slice(2).map(p=>`${p.nm}: ${fmt(p.L)}${p.r?' ℞':''}`).join('\n')+'\n\nOur identity is not found in the stars, but in Christ.'}
let R=null,tab=0,page='home';
function go(p,f){page=p;draw();if(f)scrollTo(0,0)}
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>go(a.dataset.p,1));
function draw(){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p==page));const m=$('#m');
if(page=='home')m.innerHTML=home();
else if(page=='report'){if(!R){m.innerHTML='<h2>My Report</h2><p class="mut">No report yet.</p><button class="btn" onclick="go(\'home\')">Get My Chart</button>';return}
const S=secs(R);m.innerHTML=`<div class="dash"><div class="side noprint">${TABS.map((t,i)=>`<a class="${i==tab?'on':''}" onclick="tab=${i};draw();scrollTo(0,0)">${t}</a>`).join('')}</div><div>${TABS.map((_,i)=>`<div class="sec" style="display:${i==tab?'block':'none'}">${S[i]}</div>`).join('')}${DISC}<div class="noprint"><button class="btn o" onclick="saveR()">Save report locally</button> <button class="btn o" onclick="print()">Print / PDF</button></div></div></div>`;}
else if(page=='learn')m.innerHTML=`<h2>Learn</h2><div class="card"><b>Signs</b><p>Twelve 30° divisions of the tropical zodiac, anchored to the March equinox.</p></div><div class="card"><b>Planets</b><p>Each body symbolizes a theme, such as the Moon for emotional needs.</p></div><div class="card"><b>Houses</b><p>Twelve areas of life, determined by birth time and place.</p></div><div class="card"><b>Aspects</b><p>Angles between planets, read as relationships between themes.</p></div><div class="card"><b>Elements & modalities</b><p>Fire, Earth, Air, Water and Cardinal, Fixed, Mutable describe temperament-style groupings.</p></div><p class="mut">Astrology is a symbolic tradition, not a scientific personality assessment.</p>`;
else if(page=='dev')m.innerHTML=`<h2>Devotionals</h2>${SC.map(s=>`<div class="card"><b class="gold">${s[0]}</b><p>${s[1]}</p><p class="mut"><i>${s[2]}</i></p></div>`).join('')}`;
else m.innerHTML=`<h2>About Selah</h2><p>Selah means to pause and reflect. This platform offers traditional astrological symbolism for self-reflection, grounded in the conviction that identity is found in Christ.</p>${DISC}`}
function home(){const dys=[...Array(31)].map((_,i)=>`<option>${i+1}</option>`).join(''),ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map((x,i)=>`<option value="${i+1}">${x}</option>`).join('');
return `<h1>Discover Your<br>Astrological Blueprint</h1><p class="mut" style="max-width:560px">A personalized natal chart and in-depth astrology report for self-understanding, growth, and reflection.</p>
<div class="grid"><div class="card"><b>Full Natal Chart</b><p class="mut">Planetary placements, houses and aspects.</p></div><div class="card"><b>Personality & Life Themes</b><p class="mut">Traditional interpretations of your placements.</p></div><div class="card"><b>Christ-Centered Reflection</b><p class="mut">Growth through biblical principles.</p></div></div>
${DISC}<div class="card" id="form"><h3>Your birth information</h3><label>Date of birth</label><div class="row"><select id="d">${dys}</select><select id="mo">${ms}</select><input id="y" type="number" placeholder="Year" min="1900" max="2100"></div>
<label>Time of birth</label><div class="row"><input id="hh" type="number" placeholder="Hour (1–12)" min="1" max="12"><input id="mi" type="number" placeholder="Minute" min="0" max="59"><select id="ap"><option>AM</option><option>PM</option></select></div>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="unk" style="width:auto"> I don’t know my birth time</label><p class="mut" style="font-size:.85rem">Without a birth time, the Ascendant and house placements are unavailable or unreliable.</p>
<label>Place of birth (city)</label><input id="city" list="cl" placeholder="Start typing a city…" autocomplete="off"><datalist id="cl">${CITIES.map(c=>`<option value="${c.n}, ${c.c}">`).join('')}</datalist>
<p class="mut" style="font-size:.8rem">This prototype includes a built-in list of major cities (no live geocoding service is reachable from a published page).</p>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ack" style="width:auto"> I acknowledge this is informational and self-reflective only, and that my identity is in Christ.</label>
<div class="err" id="err"></div><button class="btn" onclick="gen()">Generate My Full Report</button> ${localStorage&&0?'':'<button class="btn o" onclick="loadR()">Load saved</button>'}</div>`}
function gen(){const g=i=>$('#'+i).value,err=t=>{$('#err').textContent=t};
const d=+g('d'),m=+g('mo'),y=+g('y'),unk=$('#unk').checked;let h=+g('hh'),mi=+g('mi');
if(!y||y<1900||y>2100)return err('Enter a year between 1900 and 2100.');
const dt=new Date(Date.UTC(y,m-1,d));if(dt.getUTCDate()!=d)return err('That date does not exist.');
if(!unk&&(!(h>=1&&h<=12)||!(mi>=0&&mi<=59)||g('hh')===''||g('mi')===''))return err('Enter an hour (1–12) and minute (0–59), or tick “I don’t know my birth time”.');
const city=CITIES.find(c=>`${c.n}, ${c.c}`==g('city'));if(!city)return err('Please choose a city from the suggestions list.');
if(!$('#ack').checked)return err('Please acknowledge the faith and identity note first.');
let H=12,M=0,tstr='';if(!unk){H=h%12+($('#ap').value=='PM'?12:0);M=mi;tstr=`${h}:${String(mi).padStart(2,'0')} ${$('#ap').value}`}
$('#m').innerHTML='<div class="load"><div class="spin"></div><p>Calculating planetary positions…</p></div>';
setTimeout(()=>{try{if(typeof Astronomy=='undefined')throw Error('The ephemeris library did not load.');
R=build({d,m,y,known:!unk,tstr,city:city.n,country:city.c,lat:city.lat,lon:city.lon,tz:city.tz,utc:toUTC(y,m,d,H,M,city.tz)});tab=0;go('report',1)}catch(e){go('home');setTimeout(()=>$('#err').textContent='Calculation could not be completed: '+e.message,0)}},700)}
function saveR(){try{localStorage.setItem('selah',JSON.stringify(R.f));alert('Saved on this device.')}catch(e){alert('Storage unavailable.')}}
function loadR(){try{const f=JSON.parse(localStorage.getItem('selah'));if(!f)return $('#err').textContent='Nothing saved yet.';R=build(f);tab=0;go('report',1)}catch(e){$('#err').textContent='Nothing saved yet.'}}
draw();
</script></body></html>
